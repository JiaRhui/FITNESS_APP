services:
  backend:
    build: ./backend
    image: fitness-app-production-backend:latest
    container_name: fitness-backend
    ports:
      - "3001:3000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:                    # ← ADD
      - fitness-network          # ← ADD

  frontend:
    build: ./frontend
    image: fitness-app-production-frontend:latest
    container_name: fitness-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:                    # ← ADD
      - fitness-network          # ← ADD

    # ← ADD THIS ENTIRE SECTION
  prometheus:
    image: prom/prometheus:latest
    container_name: fitness-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - fitness-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fitness-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - fitness-network
    restart: unless-stopped

# ← ADD THIS ENTIRE SECTION
networks:
  fitness-network:
    driver: bridge

volumes:
  grafana-storage: